[project]
name = "DevClean"
version = "1.0.0"
description = "Controlled AI and developer-tool disk cleanup workbench for Windows 11"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "DevClean contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pyinstaller>=6.21,<7",
  "pytest>=8.4,<9",
  "ruff>=0.11",
]

[tool.uv]
required-version = "==0.11.6"
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/devclean/core/podman_image_maintenance.py" = ["E501"]
"src/devclean/ui/codex_history_dialog.py" = ["E501", "RUF100"]
"src/devclean/ui/podman_container_maintenance_dialog.py" = ["E501"]
"src/devclean/ui/podman_image_maintenance_dialog.py" = ["E501"]
"tests/test_codex_history.py" = ["E501"]
"tests/test_podman_container_maintenance.py" = ["E501"]
"tests/test_podman_image_maintenance.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = ["src"]
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

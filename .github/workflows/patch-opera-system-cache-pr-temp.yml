name: Temporary Opera System Cache PR patch

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/opera-system-cache-authority-audit-2026-08
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Run embedded semantic patch
        shell: pwsh
        run: |
          $text = Get-Content .github/workflows/patch-opera-system-cache-temp.yml -Raw
          $match = [regex]::Match($text, "(?s)@'\r?\n(.*?)\r?\n\s*'@ \| uv run --frozen python -")
          if (-not $match.Success) { throw "Could not extract embedded Python patch" }
          $script = [regex]::Replace($match.Groups[1].Value, "(?m)^ {10}", "")
          $script | uv run --frozen python -
      - name: Format and validate
        shell: pwsh
        run: |
          uv lock --check
          uv sync --frozen
          uv pip check
          uv run --frozen ruff check --fix src/devclean/core/opera_cleanup.py tests/test_opera_cleanup.py tests/test_opera_rule_authority.py
          uv run --frozen ruff format src/devclean/core/opera_cleanup.py tests/test_opera_cleanup.py tests/test_opera_rule_authority.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest -q
      - name: Commit correction and remove temporary files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-opera-system-cache-temp.yml .github/workflows/patch-opera-system-cache-pr-temp.yml
          Get-ChildItem docs/opera-system-cache-pr-note*.tmp -ErrorAction SilentlyContinue | ForEach-Object { git rm $_.FullName }
          git add src/devclean/core/opera_cleanup.py tests/test_opera_cleanup.py tests/test_opera_rule_authority.py docs/opera-system-cache-authority-audit.md docs/storage-audit-status.md
          git commit -m "Remove broad Opera System Cache deletion authority"
          git push origin HEAD:agent/opera-system-cache-authority-audit-2026-08

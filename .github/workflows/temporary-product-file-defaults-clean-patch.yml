name: Temporary product file defaults clean patch

# Second push intentionally triggers this temporary workflow after creation.
on:
  push:
    branches:
      - agent/product-file-defaults-clean-reaudit-2026-08
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-file-defaults-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/product-file-defaults-clean-reaudit-2026-08
          persist-credentials: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Apply intended product defaults changes
        run: uv run --frozen python .github/temporary-product-file-defaults-clean-patch.py

      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          git rm -f .github/temporary-product-file-defaults-clean-patch.py .github/workflows/temporary-product-file-defaults-clean-patch.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Format only touched Python files
        shell: pwsh
        run: |
          uv run --frozen ruff format src/devclean/core/_user_rules_impl.py tests/_test_rules_impl.py tests/test_learned_rule_target_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate final tree
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen ruff check src scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -m mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit final correction
        shell: pwsh
        run: |
          git config user.name "devclean-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests docs .github
          git status --short
          git commit -m "Promote audited common file defaults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/product-file-defaults-clean-reaudit-2026-08
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Temporary default rule baseline patch

on:
  push:
    branches:
      - agent/default-rule-baseline-reaudit-2026-08

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/default-rule-baseline-reaudit-2026-08
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Apply baseline correction
        run: uv run --frozen python scripts/temporary_default_rule_baseline_patch.py
      - name: Format and validate
        shell: pwsh
        run: |
          uv lock --check
          uv sync --frozen
          uv pip check
          uv run --frozen ruff check --fix src/devclean/core/_user_rules_impl.py tests/_test_rules_impl.py scripts/temporary_default_rule_baseline_patch.py
          uv run --frozen ruff format src/devclean/core/_user_rules_impl.py tests/_test_rules_impl.py scripts/temporary_default_rule_baseline_patch.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen python -m mypy
          uv run --frozen pytest
      - name: Commit correction and remove temporary patch files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-default-rule-baseline-patch.yml scripts/temporary_default_rule_baseline_patch.py
          git add src/devclean/config/delete-rules.json src/devclean/config/keep-rules.json src/devclean/core/_user_rules_impl.py tests/_test_rules_impl.py docs/default-rule-baseline-reaudit.md
          git commit -m "Remove learned decisions from packaged defaults"
          git push origin HEAD:agent/default-rule-baseline-reaudit-2026-08

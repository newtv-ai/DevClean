name: Temporary generic review routing patch

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/generic-review-routing-reaudit-2026-08
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Repair old temporary patch syntax
        run: uv run --frozen python scripts/temporary_repair_generic_patch.py
      - name: Apply generic routing correction
        run: uv run --frozen python scripts/temporary_generic_review_routing_patch.py
      - name: Apply file versus directory boundary
        run: uv run --frozen python .github/temporary-file-boundary-patch.py
      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          git rm .github/workflows/temporary-generic-review-routing-patch.yml
          git rm .github/temporary-file-boundary-patch.py
          git rm scripts/temporary_generic_review_routing_patch.py
          git rm scripts/temporary_repair_generic_patch.py
      - name: Format and validate final tree
        shell: pwsh
        run: |
          uv lock --check
          uv sync --frozen
          uv pip check
          uv run --frozen ruff check --fix src/devclean/core/_user_rules_impl.py src/devclean/core/user_rules.py src/devclean/core/triage.py src/devclean/ui/app.py tests/test_builtin_root_authority.py tests/test_generic_review_routing.py tests/test_learned_rule_target_boundary.py
          uv run --frozen ruff format src/devclean/core/_user_rules_impl.py src/devclean/core/user_rules.py src/devclean/core/triage.py src/devclean/ui/app.py tests/test_builtin_root_authority.py tests/test_generic_review_routing.py tests/test_learned_rule_target_boundary.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen python -m mypy
          uv run --frozen pytest
      - name: Commit final correction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Protect generic ambiguity and separate directory decisions"
          git push origin HEAD:agent/generic-review-routing-reaudit-2026-08

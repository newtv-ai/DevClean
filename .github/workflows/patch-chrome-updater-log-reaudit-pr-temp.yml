name: Temporary Chrome updater log PR patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out patch branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/chrome-updater-log-reaudit-2026-08
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --frozen
      - name: Apply audited patch
        run: uv run --frozen python .github/scripts/chrome_updater_log_reaudit_patch.py
      - name: Validate patch
        shell: pwsh
        run: |
          uv run --frozen ruff format src/devclean/core/chrome_cleanup.py tests/test_chrome_cleanup.py tests/test_chrome_rule_authority.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest -q
      - name: Commit audited patch and remove temporary machinery
        shell: pwsh
        run: |
          git config user.name "devclean-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/chrome_updater_log_reaudit_patch.py
          git rm .github/workflows/patch-chrome-updater-log-reaudit-pr-temp.yml
          if (Test-Path .github/workflows/patch-chrome-updater-log-reaudit-temp.yml) { git rm .github/workflows/patch-chrome-updater-log-reaudit-temp.yml }
          git add src/devclean/core/chrome_cleanup.py tests/test_chrome_cleanup.py tests/test_chrome_rule_authority.py docs/chrome-updater-storage-authority-reaudit.md docs/full-rule-reaudit-2026-08.md
          git commit -m "Protect Chromium Updater diagnostic logs"
          git push origin HEAD:agent/chrome-updater-log-reaudit-2026-08
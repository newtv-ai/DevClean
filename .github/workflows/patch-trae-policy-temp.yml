name: Temporary Trae policy wiring

on:
  push:
    branches:
      - agent/trae-cleanup-policy

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/trae-cleanup-policy
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --frozen
      - name: Wire Trae profile into shared facade
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def insert_import_block(text: str, marker: str, block: str) -> str:
              if block.strip() in text:
                  return text
              start = text.index(marker)
              end = text.index("\n)\n", start) + 3
              return text[:end] + block + text[end:]

          app = Path("src/devclean/core/application_cleanup.py")
          text = app.read_text(encoding="utf-8")
          text = insert_import_block(
              text,
              "from devclean.core.vscode_cleanup import (",
              '''from devclean.core.trae_cleanup import (\n    TRAE_RULES,\n    clear_trae_process_cache,\n    evaluate_trae_path,\n    match_trae_rule,\n    trae_audited_tool_roots,\n    trae_process_running,\n    trae_scan_roots,\n    whole_tree_trae_rule,\n)\n''',
          )
          text = text.replace(
              "                *vscode_scan_roots(environment),\n",
              "                *vscode_scan_roots(environment),\n                *trae_scan_roots(environment),\n",
          )
          text = text.replace(
              "    return vscode_audited_tool_roots(environment)\n",
              "    return (*vscode_audited_tool_roots(environment), *trae_audited_tool_roots(environment))\n",
          )
          text = text.replace(
              '''    vscode = match_vscode_rule(path, environment)\n    if vscode is not None:\n        return vscode\n''',
              '''    trae = match_trae_rule(path, environment)\n    if trae is not None:\n        return trae\n    vscode = match_vscode_rule(path, environment)\n    if vscode is not None:\n        return vscode\n''',
          )
          text = text.replace(
              '''    decision = evaluate_vscode_path(\n        path,\n        logical_size=logical_size,\n        last_used=last_used,\n        now=now,\n        process_running=process_running,\n        environment=environment,\n    )\n    if decision is None:\n        decision = evaluate_cursor_path(\n''',
              '''    decision = evaluate_trae_path(\n        path,\n        logical_size=logical_size,\n        last_used=last_used,\n        now=now,\n        process_running=process_running,\n        environment=environment,\n    )\n    if decision is None:\n        decision = evaluate_vscode_path(\n            path,\n            logical_size=logical_size,\n            last_used=last_used,\n            now=now,\n            process_running=process_running,\n            environment=environment,\n        )\n    if decision is None:\n        decision = evaluate_cursor_path(\n''',
          )
          text = text.replace(
              '''def application_process_running(app_id: str) -> bool:\n    if app_id == "vscode":\n''',
              '''def application_process_running(app_id: str) -> bool:\n    if app_id == "trae":\n        return trae_process_running()\n    if app_id == "vscode":\n''',
          )
          text = text.replace(
              "    clear_vscode_process_cache()\n",
              "    clear_vscode_process_cache()\n    clear_trae_process_cache()\n",
          )
          text = text.replace(
              '''    dynamic = whole_tree_vscode_rule(path, environment)\n    if dynamic is not None:\n        return dynamic\n''',
              '''    dynamic = whole_tree_trae_rule(path, environment)\n    if dynamic is not None:\n        return dynamic\n    dynamic = whole_tree_vscode_rule(path, environment)\n    if dynamic is not None:\n        return dynamic\n''',
          )
          text = text.replace(
              '        "vscode": "VS Code",\n',
              '        "vscode": "VS Code",\n        "trae": "Trae",\n',
          )
          text = text.replace(
              '    "VSCODE_RULES",\n',
              '    "VSCODE_RULES",\n    "TRAE_RULES",\n',
          )
          app.write_text(text, encoding="utf-8")

          user_rules = Path("src/devclean/core/user_rules.py")
          text = user_rules.read_text(encoding="utf-8")
          marker = "    vscode_user_markers = (\n"
          block = '''    trae_user_markers = (\n        r"\\trae\\user\\workspacestorage",\n        r"\\trae cn\\user\\workspacestorage",\n        r"\\trae\\user\\history",\n        r"\\trae cn\\user\\history",\n        r"%appdata%\\trae\\user\\workspacestorage",\n        r"%appdata%\\trae cn\\user\\workspacestorage",\n    )\n    trae_keep_markers = (\n        r"\\trae\\user\\globalstorage",\n        r"\\trae cn\\user\\globalstorage",\n        r"\\trae\\backups",\n        r"\\trae cn\\backups",\n        r"\\.trae\\extensions",\n        r"%appdata%\\trae\\user\\globalstorage",\n        r"%userprofile%\\.trae\\extensions",\n    )\n    if any(marker in value for marker in trae_user_markers):\n        return DecisionOwner.USER\n    if any(marker in value for marker in trae_keep_markers):\n        return DecisionOwner.KEEP\n\n'''
          if "trae_user_markers" not in text:
              text = text.replace(marker, block + marker)
          user_rules.write_text(text, encoding="utf-8")

          launcher = Path("src/devclean/ui/launcher.py")
          text = launcher.read_text(encoding="utf-8")
          if "open_trae_maintenance_dialog" not in text:
              text = text.replace(
                  "from devclean.ui.vscode_maintenance_dialog import open_vscode_maintenance_dialog\n",
                  "from devclean.ui.vscode_maintenance_dialog import open_vscode_maintenance_dialog\nfrom devclean.ui.trae_maintenance_dialog import open_trae_maintenance_dialog\n",
              )
              anchor = '''    tools.add_command(\n        label="VS Code 存储维护…",\n        command=lambda: open_vscode_maintenance_dialog(root),\n    )\n'''
              text = text.replace(
                  anchor,
                  anchor + '''    tools.add_command(\n        label="Trae 存储维护…",\n        command=lambda: open_trae_maintenance_dialog(root),\n    )\n''',
              )
          launcher.write_text(text, encoding="utf-8")
          '@ | uv run --frozen python -
      - name: Format and verify
        shell: pwsh
        run: |
          uv run --frozen ruff check --fix src/devclean/core/application_cleanup.py src/devclean/core/user_rules.py src/devclean/core/trae_cleanup.py src/devclean/core/trae_maintenance.py src/devclean/ui/launcher.py src/devclean/ui/trae_maintenance_dialog.py tests/test_trae_cleanup.py tests/test_trae_rule_authority.py
          uv run --frozen ruff format src/devclean/core/application_cleanup.py src/devclean/core/user_rules.py src/devclean/core/trae_cleanup.py src/devclean/core/trae_maintenance.py src/devclean/ui/launcher.py src/devclean/ui/trae_maintenance_dialog.py tests/test_trae_cleanup.py tests/test_trae_rule_authority.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest -q
      - name: Commit wired policy and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-trae-policy-temp.yml
          git add src/devclean/core/application_cleanup.py src/devclean/core/user_rules.py src/devclean/ui/launcher.py src/devclean/core/trae_cleanup.py src/devclean/core/trae_maintenance.py src/devclean/ui/trae_maintenance_dialog.py tests/test_trae_cleanup.py tests/test_trae_rule_authority.py docs/application-cleanup-trae.md
          git commit -m "wire Trae application cleanup policy"
          git push origin HEAD:agent/trae-cleanup-policy

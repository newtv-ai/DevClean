name: Temporary release license re-audit

on:
  push:
    branches:
      - agent/release-license-reaudit-2026-08

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/release-license-reaudit-2026-08
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --frozen
      - name: Apply release license correction
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          script = Path("scripts/build_windows_exe.ps1")
          text = script.read_text(encoding="utf-8")
          old = '''        "Tcl-Tk-license.terms" = (\n            Join-Path $pythonBasePrefix "tcl\\tk8.6\\license.terms"\n        )\n        "PyInstaller-COPYING.txt" = $pyinstallerLicenseMatches[0].FullName\n'''
          new = '''        "Tcl-license.terms" = (\n            Join-Path $pythonBasePrefix "tcl\\tcl8.6\\license.terms"\n        )\n        "Tk-license.terms" = (\n            Join-Path $pythonBasePrefix "tcl\\tk8.6\\license.terms"\n        )\n        "PyInstaller-COPYING.txt" = $pyinstallerLicenseMatches[0].FullName\n'''
          if old not in text:
              raise SystemExit("license source block not found")
          text = text.replace(old, new, 1)
          old_allow = '''        "licenses\\PyInstaller-COPYING.txt"\n        "licenses\\Tcl-Tk-license.terms"\n'''
          new_allow = '''        "licenses\\PyInstaller-COPYING.txt"\n        "licenses\\Tcl-license.terms"\n        "licenses\\Tk-license.terms"\n'''
          if old_allow not in text:
              raise SystemExit("license allowlist block not found")
          text = text.replace(old_allow, new_allow, 1)
          script.write_text(text, encoding="utf-8")

          doc = Path("docs/release-license-reaudit.md")
          doc.write_text(
              """# Windows EXE bundled-runtime license re-audit — 2026-08\n\n"
              "## Finding\n\n"
              "The Windows one-file build imports Tkinter and therefore ships both Tcl and Tk runtime material. "
              "The release payload already carried CPython, DevClean GPL and PyInstaller notices, but copied only "
              "`tk8.6/license.terms` under the combined name `Tcl-Tk-license.terms`. The separately shipped "
              "`tcl8.6/license.terms` notice was not preserved as its own bundled-runtime license artifact.\n\n"
              "## Correction\n\n"
              "The build now fails unless both `tcl\\tcl8.6\\license.terms` and `tcl\\tk8.6\\license.terms` exist, "
              "copies them as `Tcl-license.terms` and `Tk-license.terms`, and includes both in the strict public "
              "payload allowlist. The checked-in release payload is regenerated by the same locked build rather "
              "than hand-edited.\n\n"
              "## Release boundary\n\n"
              "DevClean has no runtime third-party Python package dependencies. The public EXE bundle therefore "
              "carries the DevClean GPL text plus the bundled CPython, Tcl, Tk and PyInstaller runtime notices. "
              "Build-only tooling that is not embedded into the executable is not copied into the end-user payload.\n"
              """,
              encoding="utf-8",
          )

          tracker = Path("docs/full-rule-reaudit-2026-08.md")
          tracker_text = tracker.read_text(encoding="utf-8")
          marker = "## Acceptance rule for reducing user/AI burden\n"
          release_section = (
              "## Release packaging\n\n"
              "| Surface | Status | Result |\n"
              "| --- | --- | --- |\n"
              "| Windows EXE bundled-runtime notices | ✅ re-audited | CPython, DevClean GPL, PyInstaller, Tcl and Tk notices are independently preserved by the locked build |\n"
              "| Checked-in `release/DevClean.exe` | ✅ regenerated | rebuilt from the same final branch after the notice correction; final PR CI must independently rebuild the artifact |\n\n"
          )
          if "## Release packaging\n" not in tracker_text:
              if marker not in tracker_text:
                  raise SystemExit("tracker insertion point not found")
              tracker_text = tracker_text.replace(marker, release_section + marker, 1)
              tracker.write_text(tracker_text, encoding="utf-8")
          '@ | uv run --frozen python -
      - name: Verify source gates
        shell: pwsh
        run: |
          uv lock --check
          uv run --frozen python -m pip check
          uv run --frozen ruff check src scripts tests
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest -q
      - name: Build and refresh release payload
        shell: pwsh
        run: |
          ./scripts/build_windows_exe.ps1
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          Copy-Item artifacts/windows-exe/dist release -Recurse
      - name: Commit correction and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "devclean-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-release-license-reaudit-temp.yml
          git add -- scripts/build_windows_exe.ps1 docs/release-license-reaudit.md docs/full-rule-reaudit-2026-08.md release/DevClean.exe release/licenses
          git commit -m "Re-audit bundled runtime licenses and refresh EXE"
          git push origin HEAD:agent/release-license-reaudit-2026-08

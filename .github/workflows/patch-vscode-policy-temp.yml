name: Temporary VS Code semantic patch

on:
  push:
    branches:
      - agent/vscode-cleanup-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/vscode-cleanup-policy
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --frozen
      - name: Apply semantic patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/devclean/core/vscode_cleanup.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''    explicit_data = env.get("vscode_user_data_dir")\n    explicit_extensions = env.get("vscode_extensions_dir")\n    if explicit_data:\n        data.insert(0, PureWindowsPath(explicit_data))\n    if explicit_extensions:\n        extensions.insert(0, PureWindowsPath(explicit_extensions))\n\n    if environment is None:\n        running_data, running_extensions = _running_override_roots()\n        data[0:0] = running_data\n        extensions[0:0] = running_extensions\n''',
              '''    if not portable:\n        explicit_data = env.get("vscode_user_data_dir")\n        explicit_extensions = env.get("vscode_extensions_dir")\n        if explicit_data:\n            data.insert(0, PureWindowsPath(explicit_data))\n        if explicit_extensions:\n            extensions.insert(0, PureWindowsPath(explicit_extensions))\n\n        if environment is None:\n            running_data, running_extensions = _running_override_roots()\n            data[0:0] = running_data\n            extensions[0:0] = running_extensions\n''',
          )
          text = text.replace(
              '''                "$p=Get-Process -Name Code -ErrorAction SilentlyContinue; if ($p) { 'RUNNING' }",\n''',
              '''                "$p=Get-CimInstance Win32_Process | Where-Object { "\n                "$_.Name -ieq 'Code.exe' -or $_.Name -ieq 'Code - Insiders.exe' }; "\n                "if ($p) { 'RUNNING' }",\n''',
          )
          text = text.replace(
              '''        "$p=Get-CimInstance Win32_Process | Where-Object { $_.Name -ieq 'Code.exe' }; "\n''',
              '''        "$p=Get-CimInstance Win32_Process | Where-Object { "\n        "$_.Name -ieq 'Code.exe' -or $_.Name -ieq 'Code - Insiders.exe' }; "\n''',
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_vscode_cleanup.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              '''    assert roots.data_roots[0] == PureWindowsPath(r"D:\\\\VSCodeState")\n    assert PureWindowsPath(r"E:\\\\PortableCode\\\\data\\\\user-data") in roots.data_roots\n    assert roots.extension_roots[0] == PureWindowsPath(r"F:\\\\VSCodeExtensions")\n    assert PureWindowsPath(r"E:\\\\PortableCode\\\\data\\\\extensions") in roots.extension_roots\n''',
              '''    assert roots.data_roots[0] == PureWindowsPath(r"E:\\\\PortableCode\\\\data\\\\user-data")\n    assert PureWindowsPath(r"D:\\\\VSCodeState") not in roots.data_roots\n    assert roots.extension_roots[0] == PureWindowsPath(r"E:\\\\PortableCode\\\\data\\\\extensions")\n    assert PureWindowsPath(r"F:\\\\VSCodeExtensions") not in roots.extension_roots\n''',
          )
          test_path.write_text(test, encoding="utf-8")
          '@ | uv run --frozen python -
      - name: Format and verify
        shell: pwsh
        run: |
          uv run --frozen ruff check --fix src/devclean/core/vscode_cleanup.py tests/test_vscode_cleanup.py
          uv run --frozen ruff format src/devclean/core/vscode_cleanup.py tests/test_vscode_cleanup.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest -q
      - name: Commit patch and remove temporary workflows
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-vscode-policy-temp.yml
          if (Test-Path .github/workflows/format-vscode-temp.yml) {
            git rm .github/workflows/format-vscode-temp.yml
          }
          git add src/devclean/core/vscode_cleanup.py tests/test_vscode_cleanup.py
          git commit -m "align VS Code portable and Insiders semantics"
          git push origin HEAD:agent/vscode-cleanup-policy

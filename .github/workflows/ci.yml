name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox-reaudit-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/firefox-family-reaudit-2026-08' && github.actor != 'github-actions[bot]'
    name: Temporary Firefox re-audit patch
    runs-on: windows-2025
    steps:
      - name: Check out PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/firefox-family-reaudit-2026-08
          persist-credentials: true
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --frozen
      - name: Apply audited Firefox correction
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          core = Path("src/devclean/core/firefox_cleanup.py")
          text = core.read_text(encoding="utf-8")
          old = '''_FIREFOX_CRASH_PENDING_RULE = _rule(\n    "firefox-pending-crash-reports",\n    "pending",\n    MatchKind.PREFIX,\n    DecisionOwner.TOOL,\n    RebuildCost.NONE,\n    "Firefox unsubmitted crash dumps and diagnostic metadata",\n    root_key="FIREFOX_CRASH",\n    idle_days=7,\n    min_reclaim_bytes=_MIB,\n    requires_process_closed=True,\n    size_sensitive_idle=False,\n    allow_whole_tree=True,\n)'''
          new = '''_FIREFOX_CRASH_PENDING_RULE = _rule(\n    "firefox-pending-crash-reports",\n    "pending",\n    MatchKind.PREFIX,\n    DecisionOwner.KEEP,\n    RebuildCost.HIGH,\n    "Firefox unsubmitted crash reports retained for submission and diagnosis",\n    root_key="FIREFOX_CRASH",\n)'''
          assert old in text
          text = text.replace(old, new)
          old_logs = '''        DecisionOwner.TOOL,\n        RebuildCost.NONE,\n        "Firefox updater diagnostic log",\n        root_key="FIREFOX_UPDATE_PARENT",\n        idle_days=14,\n        min_reclaim_bytes=256 * 1024,\n        requires_process_closed=True,\n        size_sensitive_idle=False,\n'''
          new_logs = '''        DecisionOwner.KEEP,\n        RebuildCost.HIGH,\n        "Firefox updater diagnostic log retained for update troubleshooting",\n        root_key="FIREFOX_UPDATE_PARENT",\n'''
          assert old_logs in text
          text = text.replace(old_logs, new_logs)
          old_root = '''    for crash_root in roots.crash_roots:\n        _append_tool_root(found, seen, crash_root, _FIREFOX_CRASH_PENDING_RULE)\n    return tuple(found)\n'''
          assert old_root in text
          text = text.replace(old_root, '''    return tuple(found)\n''')
          core.write_text(text, encoding="utf-8")

          test = Path("tests/test_firefox_cleanup.py")
          t = test.read_text(encoding="utf-8")
          old_assert = '''    assert current_log is not None and current_log.owner is DecisionOwner.TOOL\n    assert last_log is not None and last_log.owner is DecisionOwner.TOOL\n'''
          assert old_assert in t
          t = t.replace(old_assert, '''    assert current_log is not None and current_log.owner is DecisionOwner.KEEP\n    assert last_log is not None and last_log.owner is DecisionOwner.KEEP\n''')
          if "test_firefox_pending_crash_reports_are_protected_diagnostic_evidence" not in t:
              t += '''\n\ndef test_firefox_pending_crash_reports_are_protected_diagnostic_evidence() -> None:\n    pending = (\n        r"C:\\Users\\alice\\AppData\\Roaming\\Mozilla\\Firefox\\Crash Reports"\n        r"\\pending\\01234567-89ab-cdef-0123-456789abcdef.dmp"\n    )\n    rule = match_application_rule(pending, _env())\n    assert rule is not None\n    assert rule.rule_id == "firefox-pending-crash-reports"\n    assert rule.owner is DecisionOwner.KEEP\n    decision = evaluate_application_path(\n        pending,\n        logical_size=64 * _MIB,\n        last_used=_NOW - timedelta(days=365),\n        now=_NOW,\n        process_running=False,\n        environment=_env(),\n    )\n    assert decision is not None\n    assert decision.action is PolicyAction.KEEP_PROTECTED\n'''
          test.write_text(t, encoding="utf-8")

          authority = Path("tests/test_firefox_rule_authority.py")
          a = authority.read_text(encoding="utf-8")
          if "last-update.log" not in a:
              needle = '''        r"C:\\ProgramData\\Mozilla\\updates\\install-hash\\updates\\0\\update.status",\n'''
              assert needle in a
              a = a.replace(needle, needle + '''        r"C:\\ProgramData\\Mozilla\\updates\\install-hash\\updates\\last-update.log",\n        (\n            r"C:\\Users\\person\\AppData\\Roaming\\Mozilla\\Firefox\\Crash Reports"\n            r"\\pending\\01234567-89ab-cdef-0123-456789abcdef.dmp"\n        ),\n''')
          authority.write_text(a, encoding="utf-8")

          tracker = Path("docs/full-rule-reaudit-2026-08.md")
          d = tracker.read_text(encoding="utf-8")
          assert "| Firefox | ⏳ queued |" in d
          d = d.replace("| Firefox | ⏳ queued |", "| Firefox | ✅ re-verified (profile/local-cache boundary retained; pending crash reports and updater logs protected) |")
          tracker.write_text(d, encoding="utf-8")

          Path("docs/firefox-storage-authority-reaudit.md").write_text('''# Firefox storage authority re-audit — 2026-08\n\n## Scope\n\nThis pass re-verifies the Firefox Windows storage family against current Mozilla support/source documentation and closes two unsupported diagnostic deletion lanes.\n\n## Current source conclusions\n\nMozilla documents the Windows Firefox profile as two distinct locations: the Roaming profile contains persistent user data, while the Local profile contains the disk cache and other temporary files. DevClean therefore retains its existing fail-closed persistent-profile boundary and exact Local-profile/cache authority, with Firefox required to be closed for whole-tree cleanup. Custom/co-located profiles never gain whole-profile authority; only exact known cache children can be delegated.\n\nMozilla's current crash-reporting help states that `Crash Reports\\pending` contains unsubmitted crash reports and Firefox can prompt the user to submit recent reports. Mozilla troubleshooting guidance explicitly asks users to submit recent unsubmitted reports when diagnosing crashes. These objects are diagnostic evidence, not source-proven disposable cache. The old `7 days + 1 MiB` raw-delete rule was DevClean-invented and is removed.\n\nMozilla's current updater troubleshooting documentation explicitly asks users to collect `updates\\0\\update.log`, `update-elevated.log`, `last-update*.log` and `backup-update*.log` when diagnosing update failures, and describes Firefox moving/rotating those logs as updates are analyzed. It does not define DevClean's old `14 days + 256 KiB` deletion lifecycle. Those logs are therefore protected diagnostic state.\n\n## Product decision\n\n- Roaming profile, profile registry/group state, update payload/state: KEEP / protected.\n- Default/MSIX Local profile: existing source-identified temporary/cache TOOL lane retained; no widening.\n- Exact `cache2`, `startupCache` and `jumpListCache` children in custom/co-located profiles: existing narrow cache lanes retained.\n- `Crash Reports\\pending`: KEEP / protected diagnostic evidence.\n- Firefox updater logs: KEEP / protected update diagnostics.\n- Age, size, process-idle state, AI decisions and user learned rules cannot recreate authority for the protected diagnostics.\n\n## Primary references\n\n- Mozilla Support, “Unsent crash reports in Firefox” (updated 2026-01-15).\n- Mozilla Support, “Troubleshoot Firefox crashes (closing or quitting unexpectedly)”.\n- Firefox Source Docs, “Update Troubleshooting”, Update Binary Logs.\n- Mozilla Support profile guidance distinguishing the Roaming user-data profile from the Local disk-cache/temporary profile.\n\n## Revisit trigger\n\nOnly add a destructive diagnostic lane if Mozilla documents a bounded deletion API/lifecycle for the exact crash/update objects. Age, size or apparent regenerability alone are not lifecycle authority.\n''', encoding="utf-8")
          '@ | uv run --frozen python -
      - name: Format and verify patch
        shell: pwsh
        run: |
          uv run --frozen ruff format src/devclean/core/firefox_cleanup.py tests/test_firefox_cleanup.py tests/test_firefox_rule_authority.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen mypy src scripts tests
          uv run --frozen pytest -q
      - name: Restore CI, remove temporary workflow, commit and push
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          if (Test-Path .github/workflows/patch-firefox-family-reaudit-temp.yml) { git rm .github/workflows/patch-firefox-family-reaudit-temp.yml }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/ci.yml src/devclean/core/firefox_cleanup.py tests/test_firefox_cleanup.py tests/test_firefox_rule_authority.py docs/full-rule-reaudit-2026-08.md docs/firefox-storage-authority-reaudit.md
          git commit -m "Protect Firefox crash and update diagnostics"
          git push origin HEAD:agent/firefox-family-reaudit-2026-08

  build:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --frozen

      - name: Verify installed dependencies
        run: uv pip check

      - name: Lint
        run: uv run --frozen ruff check --output-format=github src scripts tests

      - name: Type check
        run: uv run --frozen python -m mypy

      - name: Test current DevClean workflow
        run: uv run --frozen pytest

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1 -Python 3.13

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DevClean-Windows-x64
          path: |
            artifacts/windows-exe/dist/DevClean.exe
            artifacts/windows-exe/dist/licenses/*.txt
          if-no-files-found: error
          retention-days: 14

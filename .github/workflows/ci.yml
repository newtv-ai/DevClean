name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release-license-reaudit:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/release-license-reaudit-2026-08'
    name: Prepare release license correction
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/release-license-reaudit-2026-08
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --frozen
      - name: Apply correction
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          script = Path("scripts/build_windows_exe.ps1")
          text = script.read_text(encoding="utf-8")
          old = '''        "Tcl-Tk-license.terms" = (\n            Join-Path $pythonBasePrefix "tcl\\tk8.6\\license.terms"\n        )\n        "PyInstaller-COPYING.txt" = $pyinstallerLicenseMatches[0].FullName\n'''
          new = '''        "Tcl-license.txt" = (\n            Join-Path $pythonBasePrefix "tcl\\tcl8.6\\license.terms"\n        )\n        "Tk-license.txt" = (\n            Join-Path $pythonBasePrefix "tcl\\tk8.6\\license.terms"\n        )\n        "PyInstaller-COPYING.txt" = $pyinstallerLicenseMatches[0].FullName\n'''
          if old not in text:
              raise SystemExit("license source block not found")
          text = text.replace(old, new, 1)
          old_allow = '''        "licenses\\PyInstaller-COPYING.txt"\n        "licenses\\Tcl-Tk-license.terms"\n'''
          new_allow = '''        "licenses\\PyInstaller-COPYING.txt"\n        "licenses\\Tcl-license.txt"\n        "licenses\\Tk-license.txt"\n'''
          if old_allow not in text:
              raise SystemExit("license allowlist block not found")
          script.write_text(text.replace(old_allow, new_allow, 1), encoding="utf-8")

          Path("docs/release-license-reaudit.md").write_text(
              "# Windows EXE bundled-runtime license re-audit — 2026-08\n\n"
              "## Finding\n\n"
              "The Windows one-file build imports Tkinter and therefore ships both Tcl and Tk runtime material. "
              "The release payload already carried CPython, DevClean GPL and PyInstaller notices, but copied only "
              "`tk8.6/license.terms` under the combined name `Tcl-Tk-license.terms`. The separately shipped "
              "`tcl8.6/license.terms` notice was not preserved as its own bundled-runtime license artifact.\n\n"
              "## Correction\n\n"
              "The build now fails unless both `tcl\\tcl8.6\\license.terms` and `tcl\\tk8.6\\license.terms` exist, "
              "copies them independently as `Tcl-license.txt` and `Tk-license.txt`, and includes both in the strict public "
              "payload allowlist. The `.txt` names keep the normal release artifact upload rule intact. The checked-in "
              "release payload is regenerated by the same locked build rather than hand-edited.\n\n"
              "## Release boundary\n\n"
              "DevClean has no runtime third-party Python package dependencies. The public EXE bundle therefore "
              "carries the DevClean GPL text plus the bundled CPython, Tcl, Tk and PyInstaller runtime notices. "
              "Build-only tooling that is not embedded into the executable is not copied into the end-user payload.\n",
              encoding="utf-8",
          )

          tracker = Path("docs/full-rule-reaudit-2026-08.md")
          tracker_text = tracker.read_text(encoding="utf-8")
          marker = "## Acceptance rule for reducing user/AI burden\n"
          release_section = (
              "## Release packaging\n\n"
              "| Surface | Status | Result |\n"
              "| --- | --- | --- |\n"
              "| Windows EXE bundled-runtime notices | ✅ re-audited | CPython, DevClean GPL, PyInstaller, Tcl and Tk notices are independently preserved by the locked build |\n"
              "| Checked-in `release/DevClean.exe` | ✅ regenerated | rebuilt from the same corrected branch; final exact-head CI independently rebuilds the Windows artifact |\n\n"
          )
          if "## Release packaging\n" not in tracker_text:
              if marker not in tracker_text:
                  raise SystemExit("tracker insertion point not found")
              tracker.write_text(tracker_text.replace(marker, release_section + marker, 1), encoding="utf-8")
          '@ | uv run --frozen python -
      - name: Verify source gates
        shell: pwsh
        run: |
          uv lock --check
          uv pip check
          uv run --frozen ruff check src scripts tests
          uv run --frozen python -m mypy
          uv run --frozen pytest -q
      - name: Build and refresh checked-in release
        shell: pwsh
        run: |
          ./scripts/build_windows_exe.ps1 -Python 3.13
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          Copy-Item artifacts/windows-exe/dist release -Recurse
      - name: Restore normal CI and commit exact correction
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "devclean-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- scripts/build_windows_exe.ps1 docs/release-license-reaudit.md docs/full-rule-reaudit-2026-08.md release/DevClean.exe release/licenses .github/workflows/ci.yml
          git commit -m "Re-audit bundled runtime licenses and refresh EXE"
          git push origin HEAD:agent/release-license-reaudit-2026-08
      - name: Dispatch exact-head validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref agent/release-license-reaudit-2026-08
          gh workflow run codeql.yml --ref agent/release-license-reaudit-2026-08

  build:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --frozen

      - name: Verify installed dependencies
        run: uv pip check

      - name: Lint
        run: uv run --frozen ruff check --output-format=github src scripts tests

      - name: Type check
        run: uv run --frozen python -m mypy

      - name: Test current DevClean workflow
        run: uv run --frozen pytest

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1 -Python 3.13

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DevClean-Windows-x64
          path: |
            artifacts/windows-exe/dist/DevClean.exe
            artifacts/windows-exe/dist/licenses/*.txt
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out patch branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/execution-safety-reaudit-2026-08
          persist-credentials: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile and sync
        shell: pwsh
        run: |
          uv lock --check
          uv sync --frozen
          uv pip check

      - name: Apply audited execution-safety correction
        shell: pwsh
        run: |
          uv run --frozen python scripts/patch_execution_safety_temp.py
          @'
          from pathlib import Path

          path = Path("src/devclean/platform/windows/exact_cleanup.py")
          text = path.read_text(encoding="utf-8")
          old_call = "        children = _list_purge_entries(current, boundary_final)\n"
          new_call = (
              "        children = _list_purge_entries(\n"
              "            current, boundary_final, already_pinned=current == root_path\n"
              "        )\n"
          )
          if old_call not in text:
              raise SystemExit("purge root traversal call anchor missing")
          text = text.replace(old_call, new_call, 1)

          old_signature = (
              "def _list_purge_entries(\n"
              "    directory: str, boundary_final: str\n"
              ") -> tuple[tuple[str, _EntryKind, int], ...]:\n"
          )
          new_signature = (
              "def _list_purge_entries(\n"
              "    directory: str, boundary_final: str, *, already_pinned: bool = False\n"
              ") -> tuple[tuple[str, _EntryKind, int], ...]:\n"
          )
          if old_signature not in text:
              raise SystemExit("purge entry signature anchor missing")
          text = text.replace(old_signature, new_signature, 1)

          old_open = '''    handle = _open_exact_directory(directory)
    try:
        metadata = read_file_metadata_handle(handle)
        if (
            not metadata.is_directory
            or metadata.is_reparse_point
            or metadata.is_cloud_placeholder
        ):
            raise ExactCleanupError("selected tree directory became a reparse/cloud boundary")
        _require_handle_in_boundary(handle, boundary_final, allow_equal=False)
        _require_final_path(handle, directory)
        entries: list[tuple[str, _EntryKind, int]] = []
'''
          new_open = '''    handle: wintypes.HANDLE | None = None
    if not already_pinned:
        handle = _open_exact_directory(directory)
        metadata = read_file_metadata_handle(handle)
        if (
            not metadata.is_directory
            or metadata.is_reparse_point
            or metadata.is_cloud_placeholder
        ):
            _close_handle(handle)
            raise ExactCleanupError("selected tree directory became a reparse/cloud boundary")
        try:
            _require_handle_in_boundary(handle, boundary_final, allow_equal=False)
            _require_final_path(handle, directory)
        except Exception:
            _close_handle(handle)
            raise
    try:
        entries: list[tuple[str, _EntryKind, int]] = []
'''
          if old_open not in text:
              raise SystemExit("purge directory open anchor missing")
          text = text.replace(old_open, new_open, 1)

          old_finally = '''        return tuple(entries)
    finally:
        _close_handle(handle)
'''
          new_finally = '''        return tuple(entries)
    finally:
        if handle is not None:
            _close_handle(handle)
'''
          if old_finally not in text:
              raise SystemExit("purge directory close anchor missing")
          text = text.replace(old_finally, new_finally, 1)
          path.write_text(text, encoding="utf-8")
          '@ | uv run --frozen python -

          $test = 'tests/test_exact_cleanup_safety.py'
          $text = Get-Content -LiteralPath $test -Raw
          $text = $text -replace 'import pytest', "import os`r`n`r`nimport pytest"
          $text = $text -replace 'cleanup\.os,', 'os,'
          Set-Content -LiteralPath $test -Value $text -Encoding utf8NoBOM
          Remove-Item -LiteralPath scripts/patch_execution_safety_temp.py -Force

      - name: Format and static checks
        shell: pwsh
        run: |
          uv run --frozen ruff format src/devclean/platform/windows/exact_cleanup.py tests/test_exact_cleanup_safety.py
          uv run --frozen ruff check src scripts tests
          uv run --frozen python -m mypy

      - name: Test current DevClean workflow
        run: uv run --frozen pytest

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1 -Python 3.13

      - name: Commit exact tested patch and restore CI
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f scripts/patch_execution_safety_temp.py
          if (Test-Path .github/workflows/patch-execution-safety-temp.yml) {
            git rm -f .github/workflows/patch-execution-safety-temp.yml
          }
          git add -- src/devclean/platform/windows/exact_cleanup.py tests/test_exact_cleanup_safety.py docs/execution-safety-reaudit.md docs/full-rule-reaudit-2026-08.md .github/workflows/ci.yml
          git commit -m "Close nested junction execution race"
          git push origin HEAD:agent/execution-safety-reaudit-2026-08

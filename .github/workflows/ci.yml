name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --frozen

      - name: Apply stock-root authority audit
        if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/builtin-root-authority-audit-2026-08'
        run: uv run --frozen python .github/scripts/patch_builtin_root_authority.py

      - name: Verify installed dependencies
        run: uv pip check

      - name: Lint
        run: uv run --frozen ruff check --output-format=github src scripts tests

      - name: Type check
        run: uv run --frozen python -m mypy

      - name: Test current DevClean workflow
        run: uv run --frozen pytest

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows_exe.ps1 -Python 3.13

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DevClean-Windows-x64
          path: |
            artifacts/windows-exe/dist/DevClean.exe
            artifacts/windows-exe/dist/licenses/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified stock-root authority audit
        if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/builtin-root-authority-audit-2026-08'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/scripts/patch_builtin_root_authority.py
          git add src/devclean/config/scan-rules.json tests/test_builtin_root_authority.py docs/builtin-root-authority-audit.md .github/workflows/ci.yml
          git commit -m "audit built-in cleanup root authority"
          git push origin HEAD:${{ github.head_ref }}

name: Bug report
description: Report a reproducible DevClean defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Actual and expected result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: 请隐藏账号、凭据和不希望公开的本机路径。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevClean version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows version and relevant filesystem/tool details
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots

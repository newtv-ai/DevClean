name: Feature request
description: Propose a DevClean improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected scan, rule, or cleanup workflow
    validations:
      required: true
